name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      versao: ${{ steps.semantic.outputs.versao }}
      publicou: ${{ steps.semantic.outputs.publicou }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Rodar semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          npx semantic-release
          if [ -f .release-version ]; then
            echo "versao=$(cat .release-version)" >> "$GITHUB_OUTPUT"
            echo "publicou=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicou=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nenhum commit exigiu release nova."
          fi

  build:
    name: Build e push multi-arch
    needs: release
    if: needs.release.outputs.publicou == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.versao }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          VERSAO: ${{ needs.release.outputs.versao }}
        run: |
          IMAGEM=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          MAJOR="${VERSAO%%.*}"
          RESTO="${VERSAO#*.}"
          MINOR="${MAJOR}.${RESTO%%.*}"
          {
            echo "tags<<EOF"
            for t in "$VERSAO" "$MINOR" "$MAJOR" latest; do echo "${IMAGEM}:${t}"; done
            echo "EOF"
            echo "imagem=$IMAGEM"
          } >> "$GITHUB_OUTPUT"

      # Imagem minuscula (alpine + curl + jq): QEMU da conta do arm64 sem
      # justificar um runner nativo so para isso.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=cf-tunnel-init
            org.opencontainers.image.description=Provisiona um Cloudflare Tunnel locally-managed pela API
            org.opencontainers.image.version=${{ needs.release.outputs.versao }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conferir o manifesto
        run: docker buildx imagetools inspect "${{ steps.tags.outputs.imagem }}:${{ needs.release.outputs.versao }}"
